apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudops-backend-netpol
  namespace: cloudops-sentinel
spec:
  podSelector:
    matchLabels:
      app: cloudops-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudops-frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to: []
      ports:
        - protocol: UDP
          port: 53
