apiVersion: v1
kind: Service
metadata:
  name: cloudops-sentinel-frontend
  namespace: cloudops-sentinel
  labels:
    app: cloudops-sentinel-frontend
    app.kubernetes.io/name: cloudops-sentinel-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudops-sentinel
spec:
  type: NodePort
  selector:
    app: cloudops-sentinel-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30000
