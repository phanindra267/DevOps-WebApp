apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-sentinel-frontend
  namespace: cloudops-sentinel
  labels:
    app: cloudops-sentinel-frontend
    app.kubernetes.io/name: cloudops-sentinel-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudops-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-sentinel-frontend
  template:
    metadata:
      labels:
        app: cloudops-sentinel-frontend
        app.kubernetes.io/name: cloudops-sentinel-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: cloudops-sentinel-frontend
          image: cloudops-sentinel-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
