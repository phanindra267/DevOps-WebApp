# Replace every XX with your own values. Prefer AWS Secrets Manager + IRSA
# (External Secrets Operator) instead of committing real values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-sentinel-secret
  namespace: cloudops-sentinel
type: Opaque
stringData:
  DB_USER: "XX"
  DB_PASSWORD: "XX"
  JWT_SECRET: "XX"
  GITHUB_TOKEN: "XX"
