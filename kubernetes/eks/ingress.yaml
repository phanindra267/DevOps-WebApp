# Requires the AWS Load Balancer Controller and an ACM certificate.
# Replace every XX with your domain, certificate ARN and path configuration.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudops-sentinel-ingress
  namespace: cloudops-sentinel
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "XX"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "XX"
      secretName: XX   # optional when using ACM termination
  rules:
    - host: "XX"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudops-sentinel-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudops-sentinel-frontend
                port:
                  number: 80
