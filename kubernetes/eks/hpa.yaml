apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudops-sentinel-backend-hpa
  namespace: cloudops-sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudops-sentinel-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # XX - replace
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # XX - replace
