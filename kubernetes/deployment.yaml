apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-sentinel-backend
  namespace: cloudops-sentinel
  labels:
    app: cloudops-sentinel-backend
    app.kubernetes.io/name: cloudops-sentinel-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudops-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-sentinel-backend
  template:
    metadata:
      labels:
        app: cloudops-sentinel-backend
        app.kubernetes.io/name: cloudops-sentinel-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: cloudops-sentinel-backend
          image: cloudops-sentinel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cloudops-sentinel-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudops-sentinel-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudops-sentinel-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
      restartPolicy: Always
